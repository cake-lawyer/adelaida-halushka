      <h1>Зворотній зв'язок</h1>

      <form>
        <label>
          Ваше ім'я
          <input
            type="text"
            minlength="2"
            maxlength="32"
            placeholder="Дастін Лукомський"
            required
          />
        </label>
        <label>
          E-mail
          <input
            type="email"
            placeholder="fesyukyaroslav@rcptosd5.ukr.education"
            required
          />
        </label>
        <label>
          Номер телефону
          <input type="tel" placeholder="+380 (93) 676 89 98" required />
        </label>
        <label>
          Суть звернення
          <select>
            <option>Покупка води</option>
            <option>Постачання до дитячих колоній</option>
            <option>SMM-відділ</option>
          </select>
        </label>
        <label>
          Текст повідомлення
          <textarea></textarea>
        </label>

        <button type="submit">Надіслати</button>
      </form>
